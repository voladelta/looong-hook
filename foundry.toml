[profile.default]
bytecode_hash = "none"
evm_version = "cancun"
ffi = true
fs_permissions = [
  { access = "read-write", path = ".forge-snapshots/" },
  { access = "read-write", path = ".devnet/" },
  { access = "read", path = "deployments/" },
]
libs = ["vendor"]
out = "out"
optimizer = true
optimizer_runs = 200
solc_version = "0.8.30"
src = "src"
via_ir = false

[invariant]
runs = 64
depth = 64
fail_on_revert = true

[lint]
exclude_lints = ["screaming-snake-case-immutable", "screaming-snake-case-const"]
lint_on_build = false
